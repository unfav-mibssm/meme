<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This tag prevents the "desktop mode on phone" glitch we discussed -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Image Fit</title>
    <style>
        /* Remove default browser margins and hide scrollbars */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents accidental scrolling */
            background-color: #000; /* Black background for any empty edges */
        }

        .image-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-image {
            width: 100%;
            height: 100%;
            /* 
               "contain" scales the image down so the WHOLE image is visible. 
               If you want the image to completely fill the screen even if it cuts 
               off the edges slightly, change "contain" to "cover". 
            */
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="image.png" alt="Fullscreen Image" class="fullscreen-image">
    </div>

</body>
</html>
